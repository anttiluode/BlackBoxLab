name: experiment

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  datarium1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Datarium 1 unit tests
        run: python -m unittest tests.test_datarium_lineage -v
      - name: Datarium 1 — lineage microscope
        run: python experiments/datarium1_lineage.py

  datarium2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Datarium 2 unit tests
        run: python -m unittest tests.test_datarium2 tests.test_datarium2_evolution -v
      - name: Datarium 2 — ecological thinkers
        run: python experiments/datarium2_thinkers.py

  datarium3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Datarium 3 unit tests
        run: python -m unittest tests.test_datarium3 -v
      - name: Datarium 3 — material memory above wave assemblies
        run: python experiments/datarium3_layers.py --preset ci

  datarium4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Datarium 4 unit tests
        run: python -m unittest tests.test_datarium4 tests.test_datarium4b -v
      - name: Datarium 4A — geography becomes body
        run: python experiments/datarium4_body.py --preset ci
      - name: Datarium 4B — builders make the body phase
        run: python experiments/datarium4b_builder_body.py --preset ci
      - name: Datarium 4 browser JavaScript parses
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, re
          for name in ("datarium4.html", "datarium4b.html"):
              text = pathlib.Path(name).read_text(encoding="utf-8")
              match = re.search(r"<script>(.*)</script>", text, re.S)
              if not match:
                  raise SystemExit(f"no inline script in {name}")
              pathlib.Path(f"/tmp/{name}.js").write_text(
                  match.group(1), encoding="utf-8"
              )
          PY
          node --check /tmp/datarium4.html.js
          node --check /tmp/datarium4b.html.js

  blackboxlab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Experiment 0 — sampling-policy organogenesis
        run: python experiments/sampling_policy_organogenesis.py
      - name: Experiment 1 — stigmergic continuous field
        run: python experiments/stigmergic_field.py
      - name: Full test suite
        run: python -m unittest discover -s tests -v
