name: experiment

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  blackboxlab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Experiment 0 — sampling-policy organogenesis
        run: python experiments/sampling_policy_organogenesis.py
      - name: Experiment 1 — stigmergic continuous field
        run: python experiments/stigmergic_field.py
      - run: python -m unittest discover -s tests -v
