name: experiment

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  datarium1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Datarium 1 unit tests
        run: python -m unittest tests.test_datarium_lineage -v
      - name: Datarium 1 — lineage microscope
        run: python experiments/datarium1_lineage.py

  datarium2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Datarium 2 unit tests
        run: python -m unittest tests.test_datarium2 tests.test_datarium2_evolution -v
      - name: Datarium 2 — ecological thinkers
        run: python experiments/datarium2_thinkers.py

  blackboxlab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Experiment 0 — sampling-policy organogenesis
        run: python experiments/sampling_policy_organogenesis.py
      - name: Experiment 1 — stigmergic continuous field
        run: python experiments/stigmergic_field.py
      - name: Full test suite
        run: python -m unittest discover -s tests -v
